plugins { id 'com.android.application' }

android {
    namespace 'com.verion.news'
    compileSdk 36

    defaultConfig {
        applicationId 'com.verion.news'
        minSdk 24
        targetSdk 36
        versionCode 9
        versionName '1.6.0'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.5.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.core:core:1.15.0'
}

// VERION NEWS v1.6: production Ads + responsive UI + automatic Blogger news notifications.
