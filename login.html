<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora AI — Log in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body><div class="auth-wrap"><a class="auth-brand" href="index.html"><span>N</span>Nexora AI</a><div class="auth-card"><h1>Log in</h1><p>Sign in and continue creating short-form projects.</p><button class="google-btn" id="googleDemo">◎ &nbsp; Continue with Google</button><div class="divider">OR</div><form class="auth-form" id="loginForm"><label>Email</label><div class="auth-input"><span>✉</span><input type="email" required placeholder="your@email.com"></div><label>Password</label><div class="auth-input"><span>▣</span><input type="password" required minlength="8" placeholder="••••••••"></div><div style="text-align:right"><a href="#">Forgot your password?</a></div><button class="auth-submit">Log in</button></form><div class="auth-foot">Don't have an account? <a href="signup.html">Create my account</a></div><div class="demo-note">Prototype login: form validation works locally. Real Google/email authentication will be connected later.</div></div></div><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('nexoraDemoUser','true');location.href='studio.html#create'});document.getElementById('googleDemo').onclick=()=>alert('Google OAuth is not connected yet.');</script></body></html>
