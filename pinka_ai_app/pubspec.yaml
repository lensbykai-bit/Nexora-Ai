name: pinka_ai
description: PINKA Ai - Pink 5D AI Dubbing UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/pinka_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/pinka_logo.png
  adaptive_icon_background: '#210015'
  adaptive_icon_foreground: assets/images/pinka_logo.png
  min_sdk_android: 23
