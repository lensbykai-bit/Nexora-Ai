name: Build SkyTap APK

on:
  push:
    branches:
      - skytap-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode project
        run: |
          base64 -d skytap_project.zip.b64 > /tmp/skytap.zip
          unzip -q /tmp/skytap.zip -d /tmp/skytap

      - name: Build debug APK
        working-directory: /tmp/skytap/SkyTap_Android_Game
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp /tmp/skytap/SkyTap_Android_Game/app/build/outputs/apk/debug/app-debug.apk /tmp/SkyTap-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyTap-v1-APK
          path: /tmp/SkyTap-v1.apk
          if-no-files-found: error
