name: Temporary SkyTap APK Build

on:
  pull_request:
    branches: ["main"]
    paths:
      - "skytap_project.zip.b64"
      - "skytap_build_trigger.txt"
      - ".github/workflows/skytap-pr-build-temp.yml"

permissions:
  contents: read

jobs:
  build-skytap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode project
        shell: bash
        run: |
          base64 -d skytap_project.zip.b64 > /tmp/skytap.zip
          rm -rf /tmp/skytap
          mkdir -p /tmp/skytap
          unzip -q /tmp/skytap.zip -d /tmp/skytap

      - name: Build APK
        working-directory: /tmp/skytap/SkyTap_Android_Game
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p output
          cp /tmp/skytap/SkyTap_Android_Game/app/build/outputs/apk/debug/app-debug.apk output/SkyTap-v1.apk
          sha256sum output/SkyTap-v1.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyTap-v1-APK
          path: output/
          if-no-files-found: error
          retention-days: 7
