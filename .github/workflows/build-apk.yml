name: Build SkyTap v2 APK

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "skytap_project.zip.b64"
      - "skytap_v2_GameView.java"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-skytap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode base SkyTap project
        shell: bash
        run: |
          base64 -d skytap_project.zip.b64 > /tmp/skytap.zip
          rm -rf /tmp/skytap
          mkdir -p /tmp/skytap
          unzip -q /tmp/skytap.zip -d /tmp/skytap

      - name: Apply and fix SkyTap v2 UI
        shell: bash
        run: |
          target=/tmp/skytap/SkyTap_Android_Game/app/src/main/java/com/skytap/game/GameView.java
          cp skytap_v2_GameView.java "$target"
          python3 - "$target" <<'PY'
          import sys
          from pathlib import Path
          f=Path(sys.argv[1])
          s=f.read_text()
          s=s.replace(
            'new LinearGradient(x,y,x+pw,y,Color.rgb(124,230,85),Color.rgb(45,158,56),Color.rgb(111,219,84),Shader.TileMode.CLAMP)',
            'new LinearGradient(x,y,x+pw,y,new int[]{Color.rgb(124,230,85),Color.rgb(45,158,56),Color.rgb(111,219,84)},null,Shader.TileMode.CLAMP)')
          s=s.replace(
            'new LinearGradient(cap.left,0,cap.right,0,Color.rgb(139,237,91),Color.rgb(50,165,57),Color.rgb(126,225,86),Shader.TileMode.CLAMP)',
            'new LinearGradient(cap.left,0,cap.right,0,new int[]{Color.rgb(139,237,91),Color.rgb(50,165,57),Color.rgb(126,225,86)},null,Shader.TileMode.CLAMP)')
          f.write_text(s)
          PY

      - name: Build debug APK
        working-directory: /tmp/skytap/SkyTap_Android_Game
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p output
          cp /tmp/skytap/SkyTap_Android_Game/app/build/outputs/apk/debug/app-debug.apk output/SkyTap-v2.apk
          sha256sum output/SkyTap-v2.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyTap-v2-APK
          path: output/
          if-no-files-found: error
          retention-days: 7
