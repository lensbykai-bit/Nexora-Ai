name: Build Nexora Dub.Ai APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create clean Android shell
        shell: bash
        run: |
          set -euo pipefail
          flutter create \
            --platforms=android \
            --android-language kotlin \
            --org com.nexora \
            --project-name nexora_dub_ai \
            .ci_flutter_app

          rm -rf .ci_flutter_app/lib
          cp -R lib .ci_flutter_app/lib
          cp pubspec.yaml .ci_flutter_app/pubspec.yaml

          if [ -f .ci_flutter_app/android/app/build.gradle.kts ]; then
            sed -i 's/com\.nexora\.nexora_dub_ai/com.nexora.dubai/g' \
              .ci_flutter_app/android/app/build.gradle.kts
          elif [ -f .ci_flutter_app/android/app/build.gradle ]; then
            sed -i 's/com\.nexora\.nexora_dub_ai/com.nexora.dubai/g' \
              .ci_flutter_app/android/app/build.gradle
          else
            echo "Android app Gradle file was not generated." >&2
            exit 1
          fi

          manifest=.ci_flutter_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="nexora_dub_ai"/android:label="Nexora Dub.Ai"/' "$manifest"

          old=.ci_flutter_app/android/app/src/main/kotlin/com/nexora/nexora_dub_ai/MainActivity.kt
          new=.ci_flutter_app/android/app/src/main/kotlin/com/nexora/dubai/MainActivity.kt
          mkdir -p "$(dirname "$new")"
          sed 's/package com.nexora.nexora_dub_ai/package com.nexora.dubai/' "$old" > "$new"
          rm -rf .ci_flutter_app/android/app/src/main/kotlin/com/nexora/nexora_dub_ai

      - name: Get packages
        working-directory: .ci_flutter_app
        run: flutter pub get

      - name: Analyze source
        working-directory: .ci_flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: .ci_flutter_app
        run: flutter build apk --release

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p output
          cp .ci_flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            output/Nexora-DubAI-v1.0.0.apk
          sha256sum output/Nexora-DubAI-v1.0.0.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-DubAI-Android
          path: output/
          if-no-files-found: error
          retention-days: 30
