name: Build Human Runner 5D APK

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "human5d_project.zip.b64"
      - "human5d_GameView.java"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-human5d:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode Human Runner 5D project
        shell: bash
        run: |
          base64 -d human5d_project.zip.b64 > /tmp/human5d.zip
          rm -rf /tmp/human5d
          mkdir -p /tmp/human5d
          unzip -o /tmp/human5d.zip -d /tmp/human5d || true
          test -d /tmp/human5d/SkyTap_Human5D_Game
          cp human5d_GameView.java /tmp/human5d/SkyTap_Human5D_Game/app/src/main/java/com/skytap/game/GameView.java

      - name: Build debug APK
        working-directory: /tmp/human5d/SkyTap_Human5D_Game
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p output
          cp /tmp/human5d/SkyTap_Human5D_Game/app/build/outputs/apk/debug/app-debug.apk output/Human-Runner-5D-v1.apk
          sha256sum output/Human-Runner-5D-v1.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Human-Runner-5D-APK
          path: output/
          if-no-files-found: error
          retention-days: 7
