<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora AI — Sign up</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body><div class="auth-wrap"><a class="auth-brand" href="index.html"><span>N</span>Nexora AI</a><div class="auth-card"><h1>Create an account</h1><p>Join Nexora AI and start building short-form projects.</p><form class="auth-form" id="signupForm"><label>Email</label><div class="auth-input"><span>✉</span><input type="email" required placeholder="your@email.com"></div><label>Password</label><div class="auth-input"><span>▣</span><input id="p1" type="password" required minlength="8" placeholder="••••••••"></div><small style="color:#9ea3a8">Minimum 8 characters</small><label>Confirm password</label><div class="auth-input"><span>▣</span><input id="p2" type="password" required minlength="8" placeholder="••••••••"></div><label class="terms"><input type="checkbox" required>I accept the Terms of Service and Privacy Policy.</label><button class="auth-submit">Create my account</button></form><div class="auth-foot">Already have an account? <a href="login.html">Log in</a></div><div class="demo-note">Prototype account creation only. A real auth database will be connected later.</div></div></div><script>document.getElementById('signupForm').addEventListener('submit',e=>{e.preventDefault();if(p1.value!==p2.value)return alert('Passwords do not match');localStorage.setItem('nexoraDemoUser','true');location.href='studio.html#create'});</script></body></html>
